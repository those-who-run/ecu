# golangci-lint's configuration, read by `make lint` and go.yml's lint step, which run
# the version pinned in tools/go.mod.
version: "2"

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused), and:
  # gosec for the security checks, revive for the style the Go team documents
  # (exported names carry a comment), errorlint so wrapped errors are compared with
  # errors.Is and errors.As, and sloglint so every log call uses log/slog's
  # key-value pairs the same way (README.md, "Conventions"), and depguard for the
  # imports a package may not have.
  default: standard
  enable:
    - depguard
    - errorlint
    - gosec
    - revive
    - sloglint
  settings:
    depguard:
      rules:
        # The race state is a pure library, tested with no NATS at all (paddock#33,
        # R11; ADR 0001, point 7): no NATS, no network, no file system. Its tests
        # may read files; internal/race/imports_test.go checks the same list.
        race:
          files:
            - "**/internal/race/*.go"
            - "!$test"
          deny:
            - pkg: github.com/nats-io
              desc: the race state is pure; publishing is the caller's (paddock#33)
            - pkg: net
              desc: the race state is pure; no network (paddock#33)
            - pkg: os
              desc: the race state is pure; no file system (paddock#33)
            - pkg: io/fs
              desc: the race state is pure; no file system (paddock#33)
            - pkg: io/ioutil
              desc: the race state is pure; no file system (paddock#33)
            - pkg: path/filepath
              desc: the race state is pure; no file system (paddock#33)
            - pkg: syscall
              desc: the race state is pure; no system calls (paddock#33)
    sloglint:
      kv-only: true
      no-global: all
      context: scope
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: receiver-naming
        - name: unused-parameter
        - name: unreachable-code
  # No preset exclusions: a finding is fixed, or silenced at its line with a
  # `//nolint:<linter> // <why>` comment a reviewer can see.
  exclusions:
    presets: []

issues:
  # Every finding, not the first few per linter.
  max-issues-per-linter: 0
  max-same-issues: 0
