# beside salsa's testdata/v1/ (README.md). Each is copied unchanged from v1,
# those-who-run/those-who-run at tag v1.0.0. fixtures_test.go fails when a file
# here has no entry, an entry has no file, or a file and its entry disagree.
#
#   file    the file in this directory
#   v1      where it is in v1 at v1.0.0; the same name
#   sha256  its sha256, which is the v1 file's
#   frames  its frames, one per line
#   entry   its entry in v1's tests/fixtures/FIXTURES.yaml at v1.0.0, which says
#           what was driven and what it pins
#
# The format is this subset of YAML, which fixtures_test.go reads: a list under
# `fixtures:`, one `key: value` per line.

